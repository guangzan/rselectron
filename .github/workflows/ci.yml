name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Exact lockfile-pinned Rslint/Prettier must stay exact; upgrades require this suite.
  CI: true
  NO_COLOR: '1'

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check (exact Prettier)
        run: pnpm run format:check
      - name: Lint (exact Rslint)
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build public facade
        run: pnpm run build
      # docs + bench only on main (push); PR keeps the critical path short.
      - name: Build documentation site
        if: github.event_name == 'push'
        run: pnpm run docs:build
      - name: Benchmark contract (skip host mismatch)
        if: github.event_name == 'push'
        run: |
          RSELECTRON_BENCH_SKIP_EVITE=1 pnpm run bench
          pnpm run bench:check

  test:
    name: Test (${{ matrix.os }} / Electron ${{ matrix.electron }})
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    # Docs-only commits (site, monorail docs, READMEs, LICENSE) are validated
    # by the dedicated `docs` job below; skip the expensive Electron matrix
    # for them. `.github/**` is intentionally NOT ignored, so editing CI
    # itself always re-runs the full suite.
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
      - '**/*.mdx'
      - 'README.md'
      - 'README.zh.md'
      - 'LICENSE'
    strategy:
      fail-fast: false
      # PR: single ubuntu + lockfile Electron. main: 3 OS × 43 + ubuntu × 28.
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"os":"ubuntu-latest","electron":"43.2.0","arch":"x64","pin":false}]}' || '{"include":[{"os":"ubuntu-latest","electron":"43.2.0","arch":"x64","pin":false},{"os":"ubuntu-latest","electron":"28.3.3","arch":"x64","pin":true},{"os":"windows-latest","electron":"43.2.0","arch":"x64","pin":false},{"os":"macos-latest","electron":"43.2.0","arch":"arm64","pin":false}]}') }}
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Pin matrix Electron major
        if: matrix.pin
        run: pnpm add -wD electron@${{ matrix.electron }}
      - name: Ensure Electron binary is installed
        run: node ./node_modules/electron/install.js
      - name: Build public facade
        run: pnpm run build
      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libnss3 \
            libatk-bridge2.0-0 \
            libdrm2 \
            libxkbcommon0 \
            libgbm1 \
            libasound2t64 \
            libcups2 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2
      - name: Run Rstest (unit, integration, packed-tarball)
        if: runner.os != 'Linux'
        run: pnpm test
      - name: Run Rstest under Xvfb
        if: runner.os == 'Linux'
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' pnpm test
      - name: Run Playwright Electron smoke
        if: runner.os != 'Linux'
        run: pnpm run test:e2e
      - name: Run Playwright Electron smoke under Xvfb
        if: runner.os == 'Linux'
        env:
          ELECTRON_DISABLE_SANDBOX: '1'
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' pnpm run test:e2e
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.arch }}-electron-${{ matrix.electron }}-${{ github.run_attempt }}
          path: |
            node_modules/.cache/.rstest-results/
            test-results/
            playwright-report/
            tests/fixtures/**/out/
          if-no-files-found: ignore
          retention-days: 14

  docs:
    name: Docs build & content tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Complement of `test`'s paths-ignore: docs-only commits validate the
    # site here (cheap, no Electron) instead of the full matrix. Runs in
    # parallel with `quality` since it needs none of its artifacts.
    paths:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
      - '**/*.mdx'
      - 'README.md'
      - 'README.zh.md'
      - 'LICENSE'
    steps:
      - uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # docs-site.test.ts builds the site itself and asserts content, nav,
      # SEO artifacts, link integrity, and zh/en parity — no separate
      # docs:build step is needed here.
      - name: Run documentation content tests
        run: pnpm run test:docs
