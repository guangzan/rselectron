name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Enable Corepack
        run: corepack enable
      - name: Install npm for trusted publishing / provenance
        run: npm install -g npm@latest
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Build public facade
        run: corepack pnpm run build
      - name: Create release PR or publish to npm
        id: changesets
        uses: changesets/action@v1
        with:
          version: corepack pnpm exec changeset version
          publish: corepack pnpm run release:publish
          commit: 'ci: version packages'
          title: 'ci: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty string opts into OIDC trusted publishing when configured on npm;
          # fall back to NPM_TOKEN when the secret is present.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: 'true'
