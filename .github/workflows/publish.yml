name: Publish Package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'guangzan/rselectron'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - name: Set node version from .node-version
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org/
          cache: pnpm

      - name: Install deps
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build public facade
        run: pnpm run build

      - name: Upgrade npm for OIDC trusted publishing
        run: npm i -g npm@^11.5.2

      - name: Publish to npm
        # Do not set NODE_AUTH_TOKEN — trusted publishing uses OIDC.
        run: pnpm run publish-ci ${{ github.ref_name }}

      - name: Generate Changelog
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
